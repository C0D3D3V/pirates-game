<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Stilgrenze Pirates</title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-image: url(assets/Map_background.png);
            background-size: cover;
        }
        #app {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
        }
        .map-wrapper {
            overflow: hidden;
            flex-shrink: 0;
        }
        .map {
            background-image: url(assets/background.jpg);
            background-size: cover;
            padding: 50px;
            transform-origin: top left;
            display: inline-block;
        }
        .tile-header-row, .tile-map-row {
            display: flex;
            flex-wrap: nowrap;
        }
        .tile-label {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 11px;
            font-family: Georgia, 'Times New Roman', serif;
            color: rgba(255, 215, 100, 0.9);
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9);
            font-weight: bold;
            letter-spacing: 0.5px;
            user-select: none;
        }
        .tile-corner { width: 30px; height: 30px; }
        .tile-col-label { width: 50px; height: 30px; }
        .tile-row-label { width: 30px; height: 50px; }
        .tile {
            position: relative;
            width: 50px;
            height: 50px;
            background-size: contain;
            background-repeat: no-repeat;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15);
        }
        .ship {
            position: absolute;
            width: 50px;
            height: 50px;
            background-size: contain;
            background-repeat: no-repeat;
        }
        .explosion {
            position: absolute;
            height: 50px;
            width: 50px;
            background-size: contain;
            background-repeat: no-repeat;
        }
        .port { position: relative; }
        .porttext {
            position: absolute;
            width: 200px;
            top: -20px;
            left: 0;
            color: white;
            z-index: 100;
        }

        /* Leaderboard — fixed left */
        .leaderboard {
            position: fixed;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(100, 75, 0, 0.82);
            border: 1px solid rgba(255, 200, 50, 0.35);
            border-radius: 8px;
            padding: 20px 28px;
            min-width: 280px;
            max-width: 380px;
            backdrop-filter: blur(6px);
            z-index: 100;
        }
        .leaderboard-title {
            color: rgba(255, 215, 100, 0.95);
            font-weight: bold;
            font-family: Georgia, serif;
            font-size: 24px;
            text-align: center;
            margin-bottom: 14px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid rgba(255, 200, 50, 0.25);
            padding-bottom: 10px;
        }
        .leaderboard-item {
            color: rgba(255, 235, 190, 0.9);
            font-size: 22px;
            font-family: Georgia, serif;
            padding: 6px 0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: space-between;
            gap: 16px;
        }
        .leaderboard-gold {
            color: rgba(255, 215, 50, 0.95);
            font-weight: bold;
            white-space: nowrap;
        }

        /* Event popups — fixed right */
        .event-popups {
            position: fixed;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 520px;
            z-index: 100;
            pointer-events: none;
        }
        .event-popup {
            background: rgba(0, 0, 0, 0.72);
            color: rgba(255, 235, 190, 0.95);
            padding: 12px 20px 12px 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 22px;
            font-family: Georgia, serif;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 10px;
        }
        .event-icon {
            width: 64px;
            height: 64px;
            flex-shrink: 0;
            display: inline-block;
            background-size: contain;
            background-repeat: no-repeat;
        }
        .event-fade-enter-active { transition: opacity 0.3s, transform 0.3s; }
        .event-fade-leave-active { transition: opacity 0.8s, transform 0.8s; }
        .event-fade-enter { opacity: 0; transform: translateX(20px); }
        .event-fade-leave-to { opacity: 0; transform: translateX(20px); }
    </style>
</head>
<body>
<div id="app">
    <!-- Centered map -->
    <div class="map-wrapper" :style="mapWrapperStyle">
        <div class="map" :style="mapInnerStyle">
            <tiles-view v-bind:tiles="info.ocean.Tiles"></tiles-view>
        </div>
    </div>

    <!-- Leaderboard — left overlay -->
    <div class="leaderboard">
        <div class="leaderboard-title">Leaderboard</div>
        <div class="leaderboard-item" v-for="player in info.players">
            <span>{{ player.Name }}</span>
            <span class="leaderboard-gold">{{ player.Gold + player.GoldSpend }}g</span>
        </div>
    </div>

    <!-- Event popups — right overlay -->
    <events-view v-bind:events="info.events"></events-view>
</div>

<script src="vue.min.js"></script>
<script src="components/ship.component.js"></script>
<script src="components/tile.component.js"></script>
<script src="components/events.component.js"></script>
<script src="components/portinfo.component.js"></script>
<script>
    const URL = 'localhost:1337/';

    var app = new Vue({
        el: '#app',
        data: {
            info: {
                ocean: {},
                players: {},
                events: {}
            },
            windowWidth: window.innerWidth,
            windowHeight: window.innerHeight,
        },
        computed: {
            mapNaturalWidth: function() {
                if (!this.info.ocean.Tiles || !this.info.ocean.Tiles[0]) return 0;
                return this.info.ocean.Tiles[0].length * 50 + 130;
            },
            mapNaturalHeight: function() {
                if (!this.info.ocean.Tiles) return 0;
                return this.info.ocean.Tiles.length * 50 + 130;
            },
            mapScale: function() {
                if (!this.mapNaturalWidth || !this.mapNaturalHeight) return 1;
                var borderW = this.mapNaturalWidth + 100;
                var borderH = this.mapNaturalHeight + 100;
                return Math.min(this.windowWidth / borderW, this.windowHeight / borderH);
            },
            mapWrapperStyle: function() {
                if (!this.mapNaturalWidth) return {};
                return {
                    width:  Math.ceil(this.mapNaturalWidth  * this.mapScale) + 'px',
                    height: Math.ceil(this.mapNaturalHeight * this.mapScale) + 'px',
                };
            },
            mapInnerStyle: function() {
                if (!this.mapNaturalWidth) return {};
                return {
                    transform: 'scale(' + this.mapScale + ')',
                    width:  this.mapNaturalWidth  + 'px',
                    height: this.mapNaturalHeight + 'px',
                    marginBottom: '0',
                };
            },
        },
        created: function () {
            this.getInfo();
            setInterval(() => { this.getInfo(); }, 1000);
            window.addEventListener('resize', () => {
                this.windowWidth  = window.innerWidth;
                this.windowHeight = window.innerHeight;
            });
        },
        methods: {
            getInfo() {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', 'http://localhost:1337/status');
                xhr.send();
                xhr.onreadystatechange = (e) => {
                    if (xhr.readyState === 4 && xhr.status === 200) {
                        this.info = JSON.parse(xhr.responseText);

                        this.info.events = this.info.events.reverse();

                        this.info.players = this.info.players.sort(function(a, b) {
                            return (b.Gold + b.GoldSpend) - (a.Gold + a.GoldSpend);
                        });

                        // Transpose tiles
                        this.info.ocean.Tiles = this.info.ocean.Tiles[0].map(
                            (col, i) => this.info.ocean.Tiles.map(row => row[i])
                        );
                    }
                };
            }
        }
    });
</script>
</body>
</html>
